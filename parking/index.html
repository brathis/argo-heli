<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>argo-heli.ch</title>
    <style>
        .container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
        }
        .loading-animation {
            max-width: 70%;
        }
        .message {
            font-family: "Instrument Sans", system-ui;
            font-optical-sizing: auto;
            font-weight: 700;
            font-style: normal;
            font-variation-settings: "wdth" 100;
            text-align: center;
            display: none; /* made visible by JS after setting remaining days */
        }
        .message .text {
            font-size: 24px;
        }
        .message .days {
            font-size: 48px;
        }
        .primary-700 {
            color: #1780B5;
        }
        .primary-900 {
            color: #05405D;
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="container">
        <img class="loading-animation" src="./loading.gif" alt="Argo Heli">
        <div class="message">
            <div class="text primary-700">Noch</div>
            <div class="days primary-900"><span id="days-dynamic"></span> Tage</div>
            <div class="text primary-700">bis zum Launch!</div>
        </div>
    </div>

    <script>
        const targetDate = new Date("2024-11-01T00:00:00+01:00");
        const elDays = document.querySelector('#days-dynamic');
        const elMessage = document.querySelector(".message");
        const remainingMilliseconds = targetDate - new Date();
        const remainingDays = Math.floor(remainingMilliseconds / 1000 / 3600 / 24);
        elDays.innerHTML = remainingDays.toString();
        elMessage.style.display = 'block'
    </script>
</body>

</html>
