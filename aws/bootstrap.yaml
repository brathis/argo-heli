AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Bootstrap stack.

  Defines IAM roles and users that are required for integration with GitHub Actions.

Parameters:
  BucketName:
    Type: String
    # https://stackoverflow.com/a/50484916
    AllowedPattern: (?!(^xn--|.+-s3alias$))^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$

Resources:
  CloudFormationServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          Effect: Allow
          Principal:
            Service: cloudformation.amazonaws.com
          Action: sts:AssumeRole
          Condition:
            StringEquals:
              aws:SourceAccount: !Ref AWS::AccountId
            StringLike:
              aws:SourceArn: !Sub "arn:aws:cloudformation:*:${AWS::AccountId}:*"
      Description: Service role for creating, updating and deleting CloudFormation stacks and the corresponding AWS resources.
      Policies:
        - PolicyName: AllowCreateUpdateDeleteCloudFrontResources
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              Effect: Allow
              Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:*"
              Action: "cloudfront:*"
                # TODO: Grant more fine-grained permissions.
                # - "cloudfront:CreateCloudFrontOriginAccessIdentity"
                # - "cloudfront:CreateDistribution"
                # - "cloudfront:CreateOriginAccessControl"
                # - "cloudfront:GetOriginAccessControl" # required for delete
                # - "cloudfront:UpdateDistribution"
                # - "cloudfront:UpdateOriginAccessControl"
                # - "cloudfront:TagResource"
                # - "cloudfront:DeleteDistribution"
                # - "cloudfront:DeleteOriginAccessControl"
        - PolicyName: AllowCreateUpdateDeleteS3Resources
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              Effect: Allow
              Resource: "arn:aws:s3:::*"
              Action:
                - "s3:CreateBucket"
                - "s3:PutBucketPolicy"
                - "s3:PutBucketTagging"
                - "s3:DeleteBucket"
                - "s3:DeleteBucketPolicy"      
  CloudFormationPipelineUser:
    Type: AWS::IAM::User
    Properties:
      Policies:
        - PolicyName: AllowPassCloudFormationServiceRole
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              Effect: Allow
              Resource: !GetAtt CloudFormationServiceRole.Arn
              Action: "iam:PassRole"
        - PolicyName: AllowCreateUpdateDeleteCloudFormationStack
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              Effect: Allow
              Resource: !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/*"
              Action:
                - "cloudformation:CreateStack"
                - "cloudformation:CreateChangeSet"
                - "cloudformation:DescribeStacks"
                - "cloudformation:DescribeChangeSet"
                - "cloudformation:UpdateStack"
                - "cloudformation:ExecuteChangeSet"
                - "cloudformation:DeleteStack"
                - "cloudformation:DeleteChangeSet"
  CloudFormationPipelineUserAccessKey:
    Type: AWS::IAM::AccessKey
    Properties:
      UserName: !Ref CloudFormationPipelineUser
  CloudFormationPipelineUserSecretAccessKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      SecretString: !GetAtt CloudFormationPipelineUserAccessKey.SecretAccessKey
  DeploymentPipelineUser:
    Type: AWS::IAM::User
    Properties:
      Policies:
        - PolicyName: GrantWriteAccessToDeploymentBucketObjects
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              Effect: Allow
              Resource: !Sub "arn:aws:s3:::${BucketName}/*"
              Action:
                - "s3:PutObject"
                - "s3:DeleteObject"
        - PolicyName: GrantReadAccessToDeploymentBucket
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              Effect: Allow
              Resource: !Sub "arn:aws:s3:::${BucketName}"
              Action:
                - "s3:ListBucket"
  DeploymentPipelineUserAccessKey:
    Type: AWS::IAM::AccessKey
    Properties:
      UserName: !Ref DeploymentPipelineUser
  DeploymentPipelineUserSecretAccessKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      SecretString: !GetAtt DeploymentPipelineUserAccessKey.SecretAccessKey

Outputs:
  CloudFormationServiceRole:
    Value: !Ref CloudFormationServiceRole
    Description: The CloudFormation service role. Use this role when creating the CloudFormation stack that contains the website resources.
  CloudFormationPipelineUser:
    Value: !Ref CloudFormationPipelineUser
    Description: User which can create, update and delete AWS resources. Use this user in the GitHub Actions workflow to update AWS resources.
  CloudFormationPipelineUserAccessKey:
    Value: !Ref CloudFormationPipelineUserAccessKey
    Description: Access key for the CloudFormation pipeline user.
  CloudFormationPipelineUserSecretAccessKeySecret:
    Value: !Ref CloudFormationPipelineUserSecretAccessKeySecret
    Description: Secret access key for the CloudFormation pipeline user.
  DeploymentPipelineUser:
    Value: !Ref DeploymentPipelineUser
    Description: User which can deploy the website to the S3 bucket and trigger CloudFront invalidations. Use this user in the GitHub Actions workflow to deploy the website.
  DeploymentPipelineUserAccessKey:
    Value: !Ref DeploymentPipelineUserAccessKey
    Description: Access key for the deployment pipeline user.
  DeploymentPipelineUserSecretAccessKeySecret:
    Value: !Ref DeploymentPipelineUserSecretAccessKeySecret
    Description: Secret containing the secret access key for the deployment pipeline user.
