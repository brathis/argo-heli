<nav>
  @for (route of getTopLevelRoutes(); track route.path) {
    <div class="link">
      <div class="link-active-marker"></div>
      <a
        routerLinkActive="link-active"
        [routerLinkActiveOptions]="{ exact: !route.children }"
        [routerLink]="route.path"
      >
        {{ route.title }}
      </a>
    </div>
  }
</nav>
