<div
  class="flex flex-col justify-between gap-y-4 border-t-2 border-primary-100 px-16 py-8 text-[16px] font-semibold lg:flex-row lg:items-center"
>
  <div class="flex flex-col gap-y-4 lg:flex-row lg:gap-x-16">
    <span class="text-gray-200 max-lg:mb-4">&copy; {{ currentYear }}</span>
    <a class="text-gray-500" routerLink="/imprint">{{
      "footer.imprint" | translate
    }}</a>
    <a class="text-gray-500" routerLink="/privacy-policy">{{
      "footer.privacy-policy" | translate
    }}</a>
  </div>
  <div
    class="flex flex-col gap-y-4 text-gray-300 underline max-lg:mt-4 lg:gap-y-4"
  >
    <div class="flex flex-row gap-x-4">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="size-6"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 0 0 2.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-.282.376-.769.542-1.21.38a12.035 12.035 0 0 1-7.143-7.143c-.162-.441.004-.928.38-1.21l1.293-.97c.363-.271.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 0 0-1.091-.852H4.5A2.25 2.25 0 0 0 2.25 4.5v2.25Z"
        />
      </svg>
      <a [href]="config.contactPhone | phoneLink">{{ config.contactPhone }}</a>
    </div>
    <div class="flex flex-row gap-x-4">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="size-6"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75"
        />
      </svg>
      <a [href]="config.contactEmail | emailLink">{{ config.contactEmail }}</a>
    </div>
  </div>
</div>
