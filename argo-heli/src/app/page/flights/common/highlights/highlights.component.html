<div class="md:flex flex-row items-stretch">
  <!-- The top-level flex item for the left side of the component. -->
  <div
    class="flex-auto flex items-center justify-center bg-primary-900 p-[64px] md:w-1/3 md:h-[660px]"
  >
    <!-- Container for both the map and the legends which scales with the map and provides a reference for the legends. -->
    <div class="relative">
      <div #mapContainer></div>
      @for (
        highlight of highlights().highlights;
        track highlight.title;
        let i = $index
      ) {
        <app-map-legend
          [label]="highlight.title"
          [left]="highlight.legendX"
          [top]="highlight.legendY"
          (click)="currentHighlightIdx.set(i)"
        ></app-map-legend>
      }
    </div>
  </div>
  <div
    #highlight
    id="highlight"
    class="highlight flex-[2_2_auto] bg-no-repeat bg-cover p-[64px] md:w-2/3 max-md:min-h-[50vh]"
  >
    <h3 class="mb-[48px] text-[48px] font-bold text-gray-100">
      {{ currentHighlight().title }}
    </h3>
    <p
      class="inline-block max-w-[600px] text-[16px] font-medium leading-[32px] text-gray-100"
    >
      {{ currentHighlight().description }}
    </p>
  </div>
</div>
