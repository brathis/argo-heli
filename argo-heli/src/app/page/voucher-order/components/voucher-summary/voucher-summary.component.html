@if (total()) {
  <div class="mt-[48px] border-t-[1px] border-gray-300 pt-[8px]">
    <span class="mb-[48px] block text-[24px] font-bold text-gray-300">{{
      "voucher.summary.total" | translate
    }}</span>
    <div class="flex flex-row items-center gap-[16px]">
      <span class="text-[20px] font-bold text-gray-500">CHF</span>
      <span class="text-[48px] font-bold text-primary-900"
        >{{ total() }}.-</span
      >
    </div>
  </div>
}
