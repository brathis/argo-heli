<div class="flex flex-col gap-[8px]">
  <label
    class="text-[20px] font-bold text-gray-700"
    [htmlFor]="formControlId()"
    >{{ label() }}</label
  >
  <input
    class="w-[300px] h-[48px] rounded-[5px] p-[10px] text-[20px] font-normal text-gray-700 shadow-[0_2px_2px_rgba(0,0,0,0.15)_inset]"
    [type]="type()"
    [id]="formControlId()"
    [formControl]="control()"
    [min]="min()"
    [max]="max()"
  />
</div>
