<div class="flex flex-col gap-[8px]">
  <label
    class="text-[20px] font-bold text-gray-700"
    [htmlFor]="formControlId()"
    >{{ label() }}</label
  >
  <input
    class="input"
    [type]="type()"
    [id]="formControlId()"
    [formControl]="control()"
    [min]="min()"
    [max]="max()"
  />
</div>
