<div class="flex flex-col gap-[8px]">
  <label class="text-[20px] font-bold text-gray-700" [for]="formControlId()">{{
    label()
  }}</label>
  <select
    class="w-[300px] h-[48px] rounded-[5px] p-[10px] text-[20px] font-normal text-gray-700 bg-white shadow-[0_2px_2px_rgba(0,0,0,0.15)_inset]"
    [id]="formControlId()"
    [formControl]="control()"
  >
    <ng-content></ng-content>
  </select>
</div>
