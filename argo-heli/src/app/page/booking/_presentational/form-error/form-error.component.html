<div
  class="mt-[32px] rounded-[5px] bg-red-100 p-[16px] text-[20px] shadow-insetMd"
>
  <h3 class="mb-[12px] font-bold text-red-600">
    {{ "booking.error.title" | translate }}
  </h3>
  <p class="text-red-800">
    {{ "booking.error.text1" | translate }}
    <a class="underline" [href]="errorEmailLink()">{{ contactEmail() }}</a
    >{{ "booking.error.text2" | translate }}
    <a class="underline" [href]="contactPhone() | phoneLink">{{
      contactPhone()
    }}</a
    >.
  </p>
</div>
