<app-form-block
  [title]="'booking.flight-data.title' | translate"
  [infoText]="'booking.flight-data.info' | translate"
  [formGroup]="group()"
>
  <app-form-row>
    <app-form-select
      [label]="'booking.flight-data.base' | translate"
      formControlId="contact-data-base"
      [control]="this.baseFormControl"
    >
      <option value="LSZU">{{
        "booking.flight-data.base-buttwil" | translate
      }}</option>
    </app-form-select>
    <app-form-group
      [label]="'booking.flight-data.passengers' | translate"
      formControlId="contact-data-passengers"
      [control]="this.passengersFormControl"
      type="number"
      min="1"
      max="3"
    ></app-form-group>
  </app-form-row>
  <app-form-row>
    <app-form-group
      [label]="'booking.flight-data.date' | translate"
      formControlId="contact-data-departure-date"
      [control]="this.departureDateFormControl"
      type="date"
    ></app-form-group>
    <app-form-group
      [label]="'booking.flight-data.departure-time' | translate"
      formControlId="contact-data-departure-time"
      [control]="this.departureTimeFormControl"
      type="time"
    ></app-form-group>
  </app-form-row>
</app-form-block>
