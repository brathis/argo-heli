<div
  class="flex max-w-[1000px] flex-col rounded-[5px] bg-gray-50 p-6 sm:flex-row sm:items-center sm:gap-x-16 sm:bg-inherit sm:p-12 sm:shadow-none"
>
  <div class="mb-8 sm:mb-0 sm:basis-1/3">
    <img class="mx-auto max-h-[300px] max-w-[400px]" [src]="imgSrc()" />
  </div>
  <div class="sm:basis-2/3">
    <h3 class="mb-4 text-[24px] font-bold text-primary-800">
      {{ title() }}
    </h3>
    <p class="text-[20px] font-medium leading-[30px] text-gray-500">
      {{ text() }}
      <ng-content></ng-content>
    </p>
  </div>
</div>
