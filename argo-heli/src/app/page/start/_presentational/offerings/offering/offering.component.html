<div
  class="flex max-w-[1000px] flex-col rounded-[5px] bg-gray-50 p-12 shadow-sm sm:flex-row sm:items-center sm:gap-x-16 sm:bg-inherit sm:p-12 sm:shadow-none"
>
  <div class="mb-16 sm:mb-0 sm:basis-1/3">
    <img class="mx-auto max-h-[200px] max-w-[400px]" [src]="imgSrc()" />
  </div>
  <div class="sm:basis-2/3">
    <h3 class="mb-4 text-xl font-bold text-primary-800 sm:text-2xl">
      {{ title() }}
    </h3>
    <p class="text-md font-medium leading-[30px] text-gray-500 sm:text-lg">
      {{ text() }}
      <ng-content></ng-content>
    </p>
  </div>
</div>
